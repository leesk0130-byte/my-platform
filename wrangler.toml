# Cloudflare Pages + D1
# 로컬: npx wrangler pages dev .
# 마이그레이션: npx wrangler d1 migrations apply my-platform-db
name = "my-platform"
compatibility_date = "2024-10-01"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "my-platform-db"
database_id = "79046550-5f11-4eac-b462-4fc949dd3b9d"
migrations_dir = "migrations"

# 환경 변수(비밀값)는 Cloudflare Dashboard → Pages → 설정 → 환경 변수에서 설정하세요.
# ADMIN_EMAIL, ADMIN_PASSWORD, ADMIN_SECRET(쿠키 HMAC 서명용, 32자 이상 랜덤)
