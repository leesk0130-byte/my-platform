      <a href="pg.html">PG 수수료</a>

    </nav>
    <div class="header-auth" id="headerAuth"><div id="auth-actions"></div></div>
  </header>
  <main id="main" class="page">
    <div class="container">
      <div class="page-head">
        <nav class="breadcrumb" aria-label="breadcrumb"><a href="index.html">홈</a> <span class="bc-sep">/</span> <strong>문의하기</strong></nav>
      </div>
      <section class="section">
        <div class="card prose">
          <h1>문의하기</h1>
          <p>서비스 개선, 콘텐츠 제휴, 오류 제보는 아래 양식으로 남겨 주세요. 접수 후 1-2 영업일 내 답변드립니다.</p>
          <form id="contact-form">
            <div class="form-group">
              <label for="contact-name">이름</label>
              <input id="contact-name" type="text" required>
            </div>
            <div class="form-group">
              <label for="contact-email">이메일</label>
              <input id="contact-email" type="email" required>
            </div>
            <div class="form-group">
              <label for="contact-subject">문의 유형</label>
              <select id="contact-subject">
                <option value="서비스 문의">서비스 문의</option>
                <option value="콘텐츠 제안">콘텐츠 제안</option>
                <option value="오류 제보">오류 제보</option>
                <option value="제휴 문의">제휴 문의</option>
              </select>
            </div>
            <div class="form-group">
              <label for="contact-message">문의 내용</label>
              <textarea id="contact-message" rows="8" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">문의 보내기</button>
            <p id="contact-msg" class="section-desc"></p>
          </form>
        </div>
      </section>
    </div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script>
    (function () {
      var form = document.getElementById("contact-form");
      var msg = document.getElementById("contact-msg");
      var submitBtn = form.querySelector('button[type="submit"]');

      // Firestore 초기화
      var db = null;
      try {
        if (window.FIREBASE_CONFIG && window.firebase) {
          if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
          if (typeof firebase.firestore === 'function') db = firebase.firestore();
        }
      } catch (e) { db = null; }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var name = document.getElementById("contact-name").value.trim();
        var email = document.getElementById("contact-email").value.trim();
        var subject = document.getElementById("contact-subject").value.trim();
        var body = document.getElementById("contact-message").value.trim();

        if (!name || !email || !body) {
          msg.textContent = "모든 항목을 입력해 주세요.";
          msg.style.color = "#dc2626";
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "전송 중...";
        msg.textContent = "";

        var inquiry = {
          name: name,
          email: email,
          subject: subject,
          message: body,
          createdAt: new Date().toISOString(),
          status: "new"
        };

        if (db) {
          db.collection("inquiries").add(inquiry)
            .then(function () {
              msg.textContent = "문의가 접수되었습니다. 1-2 영업일 내 답변드리겠습니다.";
              msg.style.color = "#047857";
              form.reset();
            })
            .catch(function () {
              // Firestore 실패 시 mailto 폴백
              fallbackMailto(name, email, subject, body);
            })
            .finally(function () {
              submitBtn.disabled = false;
              submitBtn.textContent = "문의 보내기";
            });
        } else {
          fallbackMailto(name, email, subject, body);
          submitBtn.disabled = false;
          submitBtn.textContent = "문의 보내기";
        }
      });

      function fallbackMailto(name, email, subject, body) {
        var mailSubject = "[가맹점숲] " + subject + " - " + name;
        var mailBody = "이름: " + name + "\n이메일: " + email + "\n\n문의 내용:\n" + body;
        window.location.href = "mailto:leesk0130@naver.com?subject=" + encodeURIComponent(mailSubject) + "&body=" + encodeURIComponent(mailBody);
        msg.textContent = "메일 앱으로 문의 양식을 전달했습니다. 발송을 완료해 주세요.";
        msg.style.color = "#047857";
      }
    })();
  </script>
