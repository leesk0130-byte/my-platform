<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가맹점숲 관리자</title>
  <meta name="robots" content="noindex,nofollow">
  <script>(function(){try{var k='gmj-theme',s=localStorage.getItem(k),m=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches,t=(s==='dark'||s==='light')?s:(m?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/css/common.css?v=20260413">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@1.3.6/dist/quill.snow.css">
  <style>
    .admin-hidden { display: none !important; }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (max-width: 720px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
    .summary-card { padding: 16px; }
    .summary-card .label { font-size: var(--fs-12); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .summary-card .value { font-size: var(--fs-28, 28px); font-weight: 700; color: var(--text-strong); margin-top: 6px; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-bottom: 16px;
    }
    .toolbar .grow { flex: 1 1 240px; }
    .toolbar .right { margin-left: auto; display: flex; gap: 8px; }
    @media (max-width: 640px) { .toolbar .right { margin-left: 0; width: 100%; } }
    .admin-table-wrap { overflow-x: auto; }
    .admin-table .actions { display: flex; gap: 6px; }
    .admin-table .pin-on { color: var(--primary-2); }
    .admin-editor-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    @media (max-width: 960px) { .admin-editor-grid { grid-template-columns: 1fr; } }
    #quill-editor { min-height: 420px; background: var(--surface); border-radius: var(--radius-sm); }
    .ql-toolbar.ql-snow, .ql-container.ql-snow { border-color: var(--border) !important; }
    .ql-container.ql-snow { font-family: var(--font); font-size: var(--fs-15); }
    .ql-editor { min-height: 380px; color: var(--text); }
    [data-theme="dark"] .ql-snow .ql-stroke { stroke: var(--text); }
    [data-theme="dark"] .ql-snow .ql-fill { fill: var(--text); }
    [data-theme="dark"] .ql-snow .ql-picker { color: var(--text); }
    [data-theme="dark"] .ql-snow .ql-picker-options { background: var(--surface-2); }
    .cover-preview { margin-top: 8px; max-width: 260px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .row-inline { display: flex; gap: 10px; flex-wrap: wrap; }
    .row-inline .form-row { flex: 1 1 160px; margin-bottom: 0; }
    .mobile-list { display: none; }
    @media (max-width: 720px) {
      .admin-table-wrap { display: none; }
      .mobile-list { display: block; }
    }
    .mobile-list .list-item { grid-template-columns: 1fr auto; }
    .mobile-list .actions { grid-column: 1 / -1; display: flex; gap: 6px; margin-top: 6px; }
    .empty-state { padding: 40px 16px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <div data-gmj-header></div>

  <main class="container" style="padding-top:24px; padding-bottom:64px;">

    <!-- ===== 로그인 뷰 ===== -->
    <section id="admin-login" class="admin-hidden" style="max-width: 440px; margin: 80px auto;">
      <div class="card">
        <h1 style="margin:0 0 8px; font-size: var(--fs-24); font-weight:700;">관리자 로그인</h1>
        <p style="margin:0 0 20px; color: var(--muted); font-size: var(--fs-14);">가맹점숲 운영자 전용</p>
        <form id="login-form" novalidate>
          <div class="form-row">
            <label class="form-label" for="login-email">이메일</label>
            <input class="input" type="email" id="login-email" name="email" autocomplete="username" required>
          </div>
          <div class="form-row">
            <label class="form-label" for="login-password">비밀번호</label>
            <input class="input" type="password" id="login-password" name="password" autocomplete="current-password" required>
          </div>
          <div class="form-error admin-hidden" id="login-error"></div>
          <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:8px;">로그인</button>
        </form>
      </div>
    </section>

    <!-- ===== 대시보드 뷰 ===== -->
    <section id="admin-dashboard" class="admin-hidden">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
        <h1 style="margin:0; font-size: var(--fs-28, 28px); font-weight:700;">대시보드</h1>
        <div style="display:flex; gap:8px;">
          <button id="btn-new" class="btn btn-primary">+ 새 글 작성</button>
          <button id="btn-logout" class="btn btn-ghost">로그아웃</button>
        </div>
      </div>

      <div class="summary-grid">
        <div class="card summary-card"><div class="label">총 글</div><div class="value" id="sum-total">–</div></div>
        <div class="card summary-card"><div class="label">공개</div><div class="value" id="sum-published">–</div></div>
        <div class="card summary-card"><div class="label">초안</div><div class="value" id="sum-draft">–</div></div>
        <div class="card summary-card"><div class="label">총 조회수</div><div class="value" id="sum-views">–</div></div>
      </div>

      <div class="card">
        <div class="toolbar">
          <div class="form-row grow" style="margin:0;">
            <div class="search-bar">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input class="input" type="search" id="filter-q" placeholder="제목/본문 검색">
            </div>
          </div>
          <select class="select" id="filter-type" style="max-width:180px;">
            <option value="">전체 타입</option>
            <option value="news">뉴스</option>
            <option value="guide">가이드</option>
            <option value="must-know">필수가이드</option>
            <option value="article">아티클</option>
          </select>
        </div>

        <div class="admin-table-wrap">
          <table class="table admin-table">
            <thead>
              <tr>
                <th style="width:32px;"></th>
                <th>제목</th>
                <th style="width:80px;">타입</th>
                <th style="width:120px;">카테고리</th>
                <th style="width:80px;">상태</th>
                <th style="width:80px;">조회</th>
                <th style="width:140px;">업데이트</th>
                <th style="width:150px;">액션</th>
              </tr>
            </thead>
            <tbody id="admin-table-body">
              <tr><td colspan="8" class="empty-state">불러오는 중...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="mobile-list" id="admin-mobile-list"></div>

        <nav class="pagination" id="admin-pagination" aria-label="페이지 이동"></nav>
      </div>
    </section>

    <!-- ===== 에디터 뷰 ===== -->
    <section id="admin-editor" class="admin-hidden">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
        <h1 id="editor-title" style="margin:0; font-size: var(--fs-28, 28px); font-weight:700;">새 글 작성</h1>
        <div style="display:flex; gap:8px;">
          <button id="btn-editor-cancel" class="btn btn-ghost">취소</button>
          <button id="btn-editor-save" class="btn btn-primary">저장</button>
        </div>
      </div>

      <form id="editor-form" novalidate>
        <div class="admin-editor-grid">
          <div>
            <div class="form-row">
              <label class="form-label" for="ed-title">제목</label>
              <input class="input" type="text" id="ed-title" required>
            </div>
            <div class="form-row">
              <label class="form-label">본문</label>
              <div id="quill-editor"></div>
            </div>
          </div>
          <div>
            <div class="card" style="padding:16px;">
              <div class="row-inline">
                <div class="form-row">
                  <label class="form-label" for="ed-type">타입</label>
                  <select class="select" id="ed-type">
                    <option value="news">뉴스</option>
                    <option value="guide">가이드</option>
                    <option value="must-know">필수가이드</option>
                    <option value="article">아티클</option>
                  </select>
                </div>
                <div class="form-row">
                  <label class="form-label" for="ed-status">상태</label>
                  <select class="select" id="ed-status">
                    <option value="draft">초안</option>
                    <option value="published" selected>공개</option>
                  </select>
                </div>
              </div>
              <div class="form-row">
                <label class="form-label" for="ed-category">카테고리</label>
                <select class="select" id="ed-category">
                  <option value="">선택 안 함</option>
                  <option value="뉴스">뉴스</option>
                  <option value="PG 수수료">PG 수수료</option>
                  <option value="정산">정산</option>
                  <option value="환불">환불</option>
                  <option value="세금">세금</option>
                  <option value="법규">법규</option>
                  <option value="운영팁">운영팁</option>
                  <option value="기타">기타</option>
                </select>
              </div>
              <div class="form-row">
                <label class="form-label" for="ed-tags">태그 (쉼표)</label>
                <input class="input" type="text" id="ed-tags" placeholder="PG, 수수료, 카드">
              </div>
              <div class="form-row">
                <label class="form-label" for="ed-slug">슬러그</label>
                <input class="input" type="text" id="ed-slug" placeholder="빈 칸이면 자동 생성">
                <div class="form-help">URL 경로. 영문/숫자/하이픈만.</div>
              </div>
              <div class="form-row">
                <label class="form-label" for="ed-excerpt">요약</label>
                <textarea class="textarea" id="ed-excerpt" style="min-height:80px;"></textarea>
              </div>
              <div class="form-row">
                <label class="form-label">커버 이미지</label>
                <input type="file" id="ed-cover-file" accept="image/*" class="input">
                <input type="hidden" id="ed-cover-url">
                <img id="ed-cover-preview" class="cover-preview admin-hidden" alt="cover preview">
              </div>
              <div class="form-row" style="flex-direction:row; align-items:center; gap:8px;">
                <input type="checkbox" id="ed-pinned">
                <label class="form-label" for="ed-pinned" style="margin:0;">상단 고정</label>
              </div>
            </div>
          </div>
        </div>
      </form>
    </section>

  </main>

  <div data-gmj-footer></div>
  <div class="toast-region" id="toast-region"></div>

  <script src="https://cdn.jsdelivr.net/npm/quill@1.3.6/dist/quill.min.js"></script>
  <script src="/js/theme.js" defer></script>
  <script src="/js/layout.js" defer></script>
  <script src="/js/admin.js?v=20260413" defer></script>
</body>
</html>
