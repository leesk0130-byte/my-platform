<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <title>가맹점 정보 상세 | 가맹점숲</title>
  <meta name="description" content="가맹점 운영을 위한 PG 수수료/정산/환불/심사 실무 글을 확인하세요.">
  <link rel="canonical" href="https://bizimshop.co.kr/article.html">
  <meta property="og:type" content="article">
  <meta property="og:title" content="가맹점 정보 상세 | 가맹점숲">
  <meta property="og:description" content="가맹점 운영을 위한 PG 수수료/정산/환불/심사 실무 글">
  <meta property="og:url" content="https://bizimshop.co.kr/article.html">
  <meta property="og:image" content="https://bizimshop.co.kr/og-image.svg">
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <div id="read-progress" style="position:fixed;top:0;left:0;height:4px;background:#059669;width:0;z-index:1000;"></div>
  <a href="#main" class="skip-link">본문으로 건너뛰기</a>
  <header>
    <h1><a href="index.html">가맹점숲</a></h1>
    <button type="button" class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false" data-toggle-nav><span></span><span></span><span></span></button>
    <nav class="header-nav" id="headerNav" aria-label="메인 메뉴">
      <a href="pg.html">PG 수수료</a>
      <a href="/calculator">PG 수수료 계산기</a>
      <a href="news.html" class="active">가맹점 정보</a>
    </nav>
    <div class="header-auth" id="headerAuth"><div id="auth-actions"></div></div>
  </header>

  <main id="main" class="page">
    <div class="container">
      <div class="page-head">
        <nav class="breadcrumb" aria-label="breadcrumb"><a href="index.html">홈</a> <span class="bc-sep">/</span> <a href="news.html">가맹점 정보</a> <span class="bc-sep">/</span> <strong id="bc-title">상세</strong></nav>
      </div>
      <div class="main-layout">
        <article class="main-content">
          <section class="card" id="article-root"></section>
          <section class="card" id="article-nav"></section>
          <section class="card" id="article-related"></section>
        </article>
        <aside class="sidebar">
          <div class="card"><h3 class="section-title"><span>목차</span></h3><ul id="article-toc"></ul></div>
          <div class="card">
            <h3 class="section-title"><span>공유</span></h3>
            <div class="form-actions">
              <button type="button" class="btn btn-outline btn-sm" id="btn-share-link">링크 복사</button>
              <a class="btn btn-outline btn-sm" id="btn-share-x" target="_blank" rel="noopener">X 공유</a>
            </div>
            <div class="form-actions" style="margin-top:10px;">
              <button type="button" class="btn btn-primary btn-sm" id="btn-helpful">도움됐어요</button>
              <span id="helpful-count">0</span>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/articles.js"></script>
  <script src="js/drawer.js"></script>
  <script>
  (function () {
    var params = new URLSearchParams(location.search);
    var id = params.get("id");
    var slug = params.get("slug");
    var root = document.getElementById("article-root");
    var toc = document.getElementById("article-toc");
    var rel = document.getElementById("article-related");
    var nav = document.getElementById("article-nav");
    var current = null;

    function updateSeo(a) {
      document.title = a.title + " | 가맹점숲";
      document.getElementById("bc-title").textContent = a.title;
      var desc = (a.excerpt || "").slice(0, 140);
      var md = document.querySelector('meta[name="description"]');
      if (md) md.setAttribute("content", desc);
      var ogt = document.querySelector('meta[property="og:title"]'); if (ogt) ogt.setAttribute("content", a.title + " | 가맹점숲");
      var ogd = document.querySelector('meta[property="og:description"]'); if (ogd) ogd.setAttribute("content", desc);
      var ogu = document.querySelector('meta[property="og:url"]'); if (ogu) ogu.setAttribute("content", location.href);
      var canonical = document.querySelector('link[rel="canonical"]'); if (canonical) canonical.href = location.origin + "/article.html?id=" + encodeURIComponent(a.id);
      var old = document.getElementById("article-ld");
      if (old) old.remove();
      var ld = document.createElement("script");
      ld.type = "application/ld+json";
      ld.id = "article-ld";
      ld.textContent = JSON.stringify({
        "@context":"https://schema.org","@type":"Article","headline":a.title,
        "datePublished": a.publishedAtIso || new Date().toISOString(),
        "dateModified": a.updatedAtIso || a.publishedAtIso || new Date().toISOString(),
        "author":{"@type":"Organization","name":"가맹점숲"},
        "mainEntityOfPage":{"@type":"WebPage","@id":location.href},
        "articleSection":a.category,"wordCount":String((a.content || "").replace(/<[^>]*>/g, "").length)
      });
      document.head.appendChild(ld);
    }

    function render(a) {
      current = a;
      var date = a.publishedAt ? new Date(a.publishedAt).toLocaleDateString("ko-KR") : "-";
      root.innerHTML = '<h1>' + a.title + '</h1><p class="feed-meta">' + a.category + " · " + date + " · " + (a.readTime || 1) + '분 읽기 · 조회 ' + (a.viewCount || 0) + '</p><div class="prose" id="article-content">' + a.content + "</div>";
      updateSeo(a);
      window.articlesApi.incrementView(a.id);
      buildToc();
      buildShare();
      buildHelpful();
      loadRelated();
      loadPrevNext();
    }

    function buildToc() {
      var content = document.getElementById("article-content");
      var hs = content ? content.querySelectorAll("h2, h3") : [];
      if (!hs.length) {
        toc.innerHTML = "<li>목차 없음</li>";
        return;
      }
      var html = [];
      for (var i = 0; i < hs.length; i++) {
        var h = hs[i];
        var idv = "toc_" + i;
        h.id = idv;
        html.push('<li><a href="#' + idv + '">' + h.textContent + "</a></li>");
      }
      toc.innerHTML = html.join("");
    }

    function buildShare() {
      var url = location.origin + "/article.html?id=" + encodeURIComponent(current.id);
      document.getElementById("btn-share-link").onclick = function () {
        navigator.clipboard.writeText(url).then(function () { alert("링크가 복사되었습니다."); });
      };
      document.getElementById("btn-share-x").href = "https://x.com/intent/tweet?url=" + encodeURIComponent(url) + "&text=" + encodeURIComponent(current.title);
    }

    function buildHelpful() {
      window.articlesApi.helpfulCount(current.id, function (_, c) {
        document.getElementById("helpful-count").textContent = String(c || 0);
      });
      document.getElementById("btn-helpful").onclick = function () {
        window.articlesApi.toggleHelpful(current.id, function (err) {
          if (err) return;
          window.articlesApi.helpfulCount(current.id, function (_, c) {
            document.getElementById("helpful-count").textContent = String(c || 0);
          });
        });
      };
    }

    function loadRelated() {
      window.articlesApi.listArticles({ onlyPublished: true, limit: 200 }, function (_, rows) {
        rows = (rows || []).filter(function (r) { return r.id !== current.id && (r.category === current.category || (r.tags || []).some(function (t) { return (current.tags || []).indexOf(t) !== -1; })); }).slice(0, 5);
        rel.innerHTML = "<h2>관련 글</h2>" + (rows.length ? ('<ul class="feed-list">' + rows.map(function (r) { return '<li class="feed-item"><a class="feed-title-wrapper" href="article.html?id=' + encodeURIComponent(r.id) + '"><span class="feed-title-content"><span class="feed-title-text">' + r.title + "</span></span></a></li>"; }).join("") + "</ul>") : "<p>관련 글 준비 중</p>");
      });
    }

    function loadPrevNext() {
      window.articlesApi.listArticles({ onlyPublished: true, limit: 300 }, function (_, rows) {
        rows = (rows || []).slice().sort(function (a, b) { return (b.publishedAt || 0) - (a.publishedAt || 0); });
        var idx = rows.findIndex(function (r) { return r.id === current.id; });
        var prev = idx > 0 ? rows[idx - 1] : null;
        var next = idx >= 0 && idx < rows.length - 1 ? rows[idx + 1] : null;
        nav.innerHTML = '<div class="form-actions">' +
          (prev ? '<a class="btn btn-outline btn-sm" href="article.html?id=' + encodeURIComponent(prev.id) + '">이전 글: ' + prev.title + '</a>' : "") +
          (next ? '<a class="btn btn-outline btn-sm" href="article.html?id=' + encodeURIComponent(next.id) + '">다음 글: ' + next.title + '</a>' : "") +
          "</div>";
      });
    }

    function fail() {
      root.innerHTML = '<div class="empty-state"><p class="empty-state-title">글을 찾을 수 없습니다.</p><p class="empty-state-desc"><a href="news.html">목록으로 이동</a></p></div>';
    }

    function init() {
      if (id) {
        window.articlesApi.getArticleById(id, function (err, a) {
          if (err || !a || !a.isPublished) return fail();
          render(a);
        });
      } else if (slug) {
        window.articlesApi.getArticleBySlug(slug, function (err, a) {
          if (err || !a || !a.isPublished) return fail();
          render(a);
        });
      } else {
        fail();
      }
    }
    init();

    window.addEventListener("scroll", function () {
      var h = document.documentElement;
      var p = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100;
      document.getElementById("read-progress").style.width = Math.max(0, Math.min(100, p)) + "%";
    });
  })();
  </script>
</body>
</html>
